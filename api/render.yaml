services:
  - type: web
    name: taseer-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MONGO_URL
        scope: build,runtime
        sync: false
      - key: DB_NAME
        value: taseer_db
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
